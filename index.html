<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241336"><link rel="manifest" href="manifest.webmanifest"><title>Ruby AI</title><style>
body{margin:0;background:#160e24;color:#f7eefc;font:16px -apple-system,BlinkMacSystemFont,sans-serif}header{padding:22px;background:#29173e;font-size:24px;font-weight:700}small{display:block;font-size:12px;color:#cdbbd8;font-weight:400}.chat{height:65vh;overflow:auto;padding:18px}.bubble{padding:12px 15px;border-radius:16px;margin:10px 0;max-width:85%;background:#34234b}.me{background:#65458b;margin-left:auto}footer{display:flex;gap:8px;padding:12px}input{flex:1;min-width:0;border:0;border-radius:12px;padding:14px}button{background:#a679db;border:0;border-radius:12px;padding:12px;font-weight:700}label{font-size:12px;margin:0 16px}</style></head><body><header>💜 Ruby AI<small>Your personal assistant • prototype</small></header><div id="chat" class="chat"></div><label><input id="speak" type="checkbox" checked> Speak replies aloud</label><footer><button id="mic" aria-label="Speak">🎙️</button><input id="msg" placeholder="Talk to Ruby..."><button id="send">Send</button></footer><script>
const box=document.getElementById('chat'),input=document.getElementById('msg');
let history=JSON.parse(localStorage.getItem('ruby-history')||'[]');
function draw(){box.innerHTML='';history.forEach(x=>{let p=document.createElement('div');p.className='bubble '+(x.who==='You'?'me':'');p.textContent=x.who+': '+x.text;box.append(p)});box.scrollTop=box.scrollHeight}
function add(who,text){history.push({who,text});localStorage.setItem('ruby-history',JSON.stringify(history));draw()}
function reply(s){let t="I'm Ruby's first little prototype, Chapo. I can listen, speak and save this conversation on your phone, but my full AI brain isn't connected yet.";if(/hello|hey|hi/i.test(s))t="Hey Chapo! 💜 Ruby here. Ready for a yarn?";if(/remember/i.test(s))t="I save this chat on this device. Full searchable memory is a future upgrade.";add('Ruby',t);if(document.getElementById('speak').checked&&'speechSynthesis'in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-AU';speechSynthesis.speak(u)}}
function send(){let s=input.value.trim();if(!s)return;input.value='';add('You',s);reply(s)}
document.getElementById('send').onclick=send;input.onkeydown=e=>{if(e.key==='Enter')send()};
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let recognition;if(SR){recognition=new SR();recognition.lang='en-AU';recognition.onresult=e=>{input.value=e.results[0][0].transcript;send()};recognition.onerror=e=>add('Ruby','Microphone unavailable: '+e.error);document.getElementById('mic').onclick=()=>recognition.start()}else document.getElementById('mic').onclick=()=>add('Ruby','Speech recognition is not supported in this browser. You can type instead.');
draw();if(!history.length)add('Ruby',"Hey Chapo! 💜 I'm your first Ruby prototype. Tap the microphone or type to chat.");</script></body></html>
